[env:esp32dev]
platform = espressif32
board = lolin_s2_mini
framework = arduino

; Firmware is ~1.6MB - needs bigger app slots than the default 1.25MB.
; min_spiffs: 2x 1.875MB app (OTA intact) + 128KB spiffs for queue storage.
; NOTE: partition changes can't go OTA - flash over USB once after this change.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200

lib_deps =
    tzapu/WiFiManager@^2.0.16-rc.2
    bblanchon/ArduinoJson@^6.21.3
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2

build_flags =
    -DCORE_DEBUG_LEVEL=3
